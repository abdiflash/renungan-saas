<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Renungan Harian Sekolah - Edueasy.id</title>
  
  <link rel="stylesheet" href="../assets/style.css">
</head>

<body>
<header class="app-header">
  <h1>Renungan Harian</h1>
  <p>Tahun Ajaran: <strong id="academicYear">Memuat...</strong></p>
</header>

<main class="container">
  <div id="loader" class="loading">⏳ Sedang mengambil data renungan...</div>

  <section id="renungan" class="hidden">
    <time id="displayDate"></time>
    <article>
      <h3 id="displayJudul"></h3>
      <div class="ayat-box">
        <span id="displayAyat" class="ayat-ref"></span>
        <blockquote id="displayAyatText" class="ayat-text"></blockquote>
      </div>
      <div id="displayIsi"></div>
    </article>
  </section>
</main>

<footer class="app-footer">
  <p>&copy; 2026 <strong id="footerSchoolName">Sekolah</strong></p>
  <p><a href="#" id="footerSchoolLink" target="_blank">Visit Website</a></p>
</footer>

<script src="config.js"></script>

<script src="../assets/app.js"></script>

</body>
</html>
